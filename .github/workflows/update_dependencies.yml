# Shared standards; upstream action SHAs verified 2026-10-18.
name: Update dependencies
'on':
  schedule:
  - cron: 41 4 * * 1
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  dependencies:
    permissions:
      contents: write
      pull-requests: write
    uses: eigger/hass-repo-standards/.github/workflows/dependency-update.yml@648dad941a118c80325f44c7a13cb5b5b9c1c788 # reviewed standards commit
    with:
      standards-ref: 648dad941a118c80325f44c7a13cb5b5b9c1c788
      domain: marklife
      packages: '["imagespec"]'
      python-version: '3.14'
      ha-components: bluetooth recorder image sensor binary_sensor
      test-profile: ha
      validation-command: python -m ruff check . && python -m ruff format --check . && python -m pytest tests/components/marklife/ -v
