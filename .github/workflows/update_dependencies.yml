# Shared standards; upstream action SHAs verified 2026-10-18.
name: Update dependencies
'on':
  schedule:
  - cron: 41 4 * * 1
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  dependencies:
    permissions:
      contents: write
      pull-requests: write
    uses: eigger/hass-repo-standards/.github/workflows/dependency-update.yml@4ccbffa9af618b14d1a32a9939cbf1fcee6cb7a0 # reviewed standards commit
    with:
      standards-ref: 4ccbffa9af618b14d1a32a9939cbf1fcee6cb7a0
      domain: marklife
      packages: '["imagespec", "blesession"]'
      python-version: '3.14'
      ha-components: bluetooth recorder image sensor binary_sensor
      test-profile: ha
      validation-command: python -m ruff check . && python -m ruff format --check . && python -m pytest tests/components/marklife/ -v
