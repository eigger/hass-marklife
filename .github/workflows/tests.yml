name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: python -m ruff check custom_components/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio bleak
          python -c "import json; print('\n'.join(json.load(open('custom_components/marklife/manifest.json'))['requirements']))" > requirements.txt
          pip install -r requirements.txt
          # Exercise the minimum imagespec version declared by the manifest.
          IMAGESPEC_MIN_VERSION="$(python - <<'PY'
          import json
          requirements = json.load(open("custom_components/marklife/manifest.json"))["requirements"]
          requirement = next(req for req in requirements if req.startswith("imagespec[datamatrix]"))
          operator, version = requirement.rsplit(">=", 1)
          assert operator == "imagespec[datamatrix]", requirement
          print(version)
          PY
          )"
          pip install --force-reinstall "imagespec[datamatrix]==${IMAGESPEC_MIN_VERSION}"
          IMAGESPEC_MIN_VERSION="$IMAGESPEC_MIN_VERSION" python -c "from importlib.metadata import version; import os; assert version('imagespec') == os.environ['IMAGESPEC_MIN_VERSION']"

      - name: Run tests
        run: |
          python -m pytest tests/ -v