# Shared standards; upstream action SHAs verified 2026-10-18.
name: Validate
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
  schedule:
  - cron: 23 3 * * 1
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: eigger/hass-repo-standards/.github/workflows/validate-integration.yml@8cd5588bf7f010fcce5fb03bd521aaaa36cb0518 # reviewed standards commit